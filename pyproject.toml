[project]
name = "ytdwpl"
version = "0.1.0"
description = "YouTube Playlist Downloader - Desktop app with queue management"
requires-python = ">=3.10"
dependencies = [
    "flet>=0.25.0",
    "yt-dlp>=2024.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-mock>=3",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.flet]
app_name = "ytdwpl"
assets_dir = "assets"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
