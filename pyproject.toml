[project]
name = "ytdwpl"
version = "0.1.0"
description = "YouTube Playlist Downloader - Desktop app with queue management"
requires-python = ">=3.10"
dependencies = [
    "flet>=0.25.0",
    "yt-dlp>=2024.12.0",
]

[tool.flet]
app_name = "ytdwpl"
assets_dir = "assets"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
